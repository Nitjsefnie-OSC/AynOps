name: osc-manual

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ref (branch, tag or SHA) to check out and test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Validate target ref
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          node <<'NODE'
          const value = process.env.TARGET_REF ?? "";
          if (value === "" || value.trim() !== value) {
            console.error("::error::target_ref must not be empty or have leading/trailing whitespace");
            process.exit(1);
          }
          NODE

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "${{ github.repository }}"
          ref: "${{ inputs.target_ref }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out SHA
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::checkout did not resolve to a lowercase 40-character SHA"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$sha"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.0.0

      - run: uv sync --locked

      - run: uv run pytest tests/ -v
